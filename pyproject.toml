[tool.ruff]

line-length = 100
target-version = "py314"
preview = true

[tool.ruff.format]
line-ending = "lf"


[tool.ruff.lint]
select = [
    "A", "ANN", "ASYNC", "B", "BLE", "C4", "COM", "DTZ", "E",
    "EM", "ERA", "F", "FA", "FURB", "G", "I", "INP", "ISC", "NPY",
    "PD", "PERF", "PGH", "PIE", "PLC", "PLE", "PLR", "PLW", "PTH", "PYI",
    "Q", "avoidable-escaped-quote", "RET", "RSE", "RUF", "S", "SIM", "SLOT", "T20", "TC", "TID",
    "TRY", "UP", "YTT"
]

ignore = [
    "missing-return-type-private-function", # implied return fine sometimes
    "missing-return-type-special-method",  # special method return types
    "any-type",  # Any is the correct type in some cases
    "long-sleep-not-forever", # Long sleeps are fine
    "return-in-generator", # I'm aware of how generators as coroutines work
    "C90",  # mccabe complexity memes
    "missing-trailing-comma", # ruff format suggested
    "D", # docs, non public doc
    "undocumented-magic-method", # documenting magic methods is often dumb.
    "line-too-long", # ruff format suggested
    "FBT", # Doesn't play nice with discord.py and discord's params
    "boolean-positional-value-in-call", # Wrong end to enforce this on.
    "logging-percent-format",  # erroneous issue with %-logging when logging can be confiured for % logging
    "single-line-implicit-string-concatenation", # ruff format suggested
    "type-name-incorrect-variance",  # no, I don't like co naming style for typevars
    "import-outside-top-level", # ruff gets this wrong, import needs to be not at top of file in some cases
    "too-many-branches", # too many branches
    "too-many-arguments", # number of function arguments
    "too-many-statements",  # too many statements.... in an async entrypoint handling graceful shutdown...
    "too-many-positional-arguments",  # too many positional arguments
    "magic-value-comparison",  # Magic value comparison, may remove later
    "ambiguous-unicode-character-string",  # ambiguous characters not something I want to enforce here.
    "unused-async",  # no, don't try andd tell me I'm wrong for async def when something is for an interface.
    "assert",  # use of assert here is a known quantity, blame typing memes
    "suspicious-non-cryptographic-random-usage",  # Yes, I know that standard pseudo-random generators are not suitable for cryptographic purposes
    "suppressible-exception",  # supressable exception, I'm not paying the overhead of contextlib.supress for stylistic choices.
    "typing-only-first-party-import", # I prefer to avoid if TYPE_CHECKING
    "typing-only-third-party-import", # I prefer to avoid if TYPE_CHECKING
    "typing-only-standard-library-import", # I prefer to avoid if TYPE_CHECKING
    "non-pep604-annotation-union", # "Use | For Union" doesn't account for typevar tuple unpacking.
    "printf-string-formatting", # No, I like % formatting more for some things...
]
unfixable = [
    "line-too-long",  # line length handled in other ways by ruff format
    "ERA",  # Don't delete commented out code
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# https://discuss.python.org/t/problems-with-typeis/55410/6
# https://discuss.python.org/t/problems-with-typeis/55410/46
# Until what can go into a TypeIs/TypeGuard changes, these are just dangerous.

"typing.TypeIs".msg = "TypeIs is fundamentally unsafe, even when using it as described to be safe"
"typing.TypeGuard".msg = "TypeGuard is fundamentally unsafe"
"typing_extensions.TypeIs".msg = "TypeIs is fundamentally unsafe, even when using it as described to be safe"
"typing_extensions.TypeGuard".msg = "TypeGuard is fundamentally unsafe"
"typing.runtime_checkable".msg = "Runtime checkable is fundamentally unsafe."
"typing_extensions.runtime_checkable".msg = "Runtime checkable is fundamentally unsafe."

# these don't work as deferred imports, intentionally, because type checkers are dumb
# and require they be imported directly from typing to work, this breaks the deferred re-export.
"typing.Final".msg = "see https://github.com/microsoft/pyright/issues/9664#issuecomment-2574042580"
"typing_extensions.Final".msg = "see https://github.com/microsoft/pyright/issues/9664#issuecomment-2574042580"
"typing.final".msg = "see https://github.com/microsoft/pyright/issues/9664#issuecomment-2574042580"
"typing_extensions.final".msg = "see https://github.com/microsoft/pyright/issues/9664#issuecomment-2574042580"


[tool.pdm]
distribution = true
[project]
name = "salamander"
description = "\"A discord bot\""
readme = "README.md"
license = {text = "MPL-2.0"}
requires-python = ">=3.14.0"
authors = [
    { name = "Michael Hall", email = "michael@michaelhall.tech" },
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "xxhash>=4.0.2",
    "platformdirs>=4.13.5",
    "apsw>=3.54.1.0",
    "scheduler @ git+https://github.com/mikeshardmind/discord-scheduler",
    "msgspec>=0.22.0",
    "discord-py[speed] @ git+https://github.com/mikeshardmind/discord.py@salamander-reloaded",
    "mikeshardmind-base2048>=1.0.0",
    "aiohttp>=3.14.5",
    "truststore>=0.10.5",
    "async-utils @ git+https://github.com/mikeshardmind/async-utils",
    "arrow>=1.4.0",
    "ciso8601>=2.3.3",
]
version = "0.1.0"


[tool.pyright]
include = ["src"]

pythonVersion = "3.14"
pythonPlatform = "All"


# strict doesn't allow turning off / downgrading severity of rules
typeCheckingMode = "standard"

# type issues
disableBytesTypePromotions = true
strictParameterNoneValue = true
reportMissingTypeStubs = "error"
reportMissingModuleSource = "warning"
reportInvalidTypeForm = "error"
reportMissingImports = "error"
reportUndefinedVariable = "error"
reportInvalidTypeVarUse = "error"
reportSelfClsParameterName = "error"

reportAbstractUsage = "error"
reportArgumentType = "error"
reportAssertTypeFailure = "error"
reportAssignmentType = "error"
reportAttributeAccessIssue = "error"
reportCallIssue = "error"
reportGeneralTypeIssues = "error"
reportInconsistentOverload = "error"
reportIndexIssue = "error"
reportInvalidTypeArguments = "error"
reportNoOverloadImplementation = "error"
reportOperatorIssue = "error"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportReturnType = "error"
reportTypedDictNotRequiredAccess = "error"
reportUnhashable = "error"
reportUnusedExcept = "error"
reportFunctionMemberAccess = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportOverlappingOverload = "error"
reportPossiblyUnboundVariable = "error"
reportConstantRedefinition = "error"
reportDeprecated = "warning"

reportIncompleteStub = "error"
reportInconsistentConstructor = "error"
reportInvalidStubStatement = "error"
reportMatchNotExhaustive = "error"
reportMissingParameterType = "error"

reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportUnnecessaryCast = "warning"

reportCallInDefaultInitializer = "warning"
reportMissingSuperCall = "none"
reportPropertyTypeMismatch = "error"

# other type-issues

reportUntypedBaseClass = "warning"  # spec says treat this as Any
reportUntypedClassDecorator = "warning"  # spec says (Any) -> Any
reportUntypedFunctionDecorator = "warning"  # spec says (Any) -> Any
reportUntypedNamedTuple = "none"  # Just no.

# not type issues, even if pyright and mypy offer checks as if they were
# by calling them "Strict mode checks"
# these are "opinionated errors with well-defined type interpretation"

reportImplicitOverride = "none"
reportMissingTypeArgument = "none"
deprecateTypingAliases = false
reportUnnecessaryComparison = "none"
reportUnnecessaryContains = "none"
reportUnnecessaryIsInstance = "none"
reportAssertAlwaysTrue = "none"
reportTypeCommentUsage = "none"

# reasonably preventing accidents

reportUnnecessaryTypeIgnoreComment = "warning"

reportUnsupportedDunderAll = "error"
reportWildcardImportFromLibrary = "error"
reportShadowedImports = "warning"

reportUninitializedInstanceVariable = "warning"
reportUnusedCoroutine = "warning"
reportUnusedExpression = "warning"

reportPrivateUsage = "warning"
reportPrivateImportUsage = "warning"

reportInvalidStringEscapeSequence = "error"
reportRedeclaration = "error"
reportUnboundVariable = "error"

reportUnusedClass = "warning"
reportUnusedImport = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"

# analysis behavior
enableTypeIgnoreComments = true
enableReachabilityAnalysis = true
analyzeUnannotatedFunctions = true
reportImportCycles = "error"
enableExperimentalFeatures = false

# inference settings
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

# overly-worriesome linter-esque options
reportImplicitStringConcatenation = "none"
reportUnusedCallResult = "none"
reportDuplicateImport = "none"  # handled by ruff


[tool.pdm.scripts]
salamander = {call = "salamander.cli:main"}
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
